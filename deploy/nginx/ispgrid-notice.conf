# ISPGrid notice page: routers send the web traffic of disabled customers here. Every path, query and Host gets
# the panel's /notice page; nothing else is served (no files, no session).
server {
    listen 8088 default_server;
    listen [::]:8088 default_server;
    server_name _;

    location / {
        fastcgi_pass unix:/run/php/ispgrid-fpm.sock;
        fastcgi_param REQUEST_METHOD GET;
        fastcgi_param REQUEST_URI /notice;
        fastcgi_param QUERY_STRING "";
        fastcgi_param SCRIPT_FILENAME /opt/ispgrid/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /opt/ispgrid/public;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param SERVER_NAME $host;
        fastcgi_param SERVER_PORT $server_port;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_hide_header X-Powered-By;
    }
}
