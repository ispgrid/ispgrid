; ISPGrid panel: PHP runs as the ispgrid user. Upload limits fit the CSV import (2 MB files).
[ispgrid]
user = ispgrid
group = ispgrid
listen = /run/php/ispgrid-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 10M
php_admin_value[memory_limit] = 256M
