#  ISPGrid: IPsec for the L2TP tunnels of routers/NAS without WireGuard (RouterOS 6). IKEv1 with one pre-shared key
#  (in ispgrid-l2tp-secret.conf), transport mode, L2TP (UDP 1701) only. The proposals include what RouterOS 6 offers
#  by default (sha1, modp1024) next to stronger ones; the router picks.
connections {
  ispgrid-l2tp {
    version = 1
    proposals = aes256-sha256-modp2048,aes128-sha256-modp2048,aes256-sha1-modp2048,aes128-sha1-modp2048,aes256-sha1-modp1024,aes128-sha1-modp1024,3des-sha1-modp1024
    local {
      auth = psk
    }
    remote {
      auth = psk
    }
    children {
      ispgrid-l2tp {
        mode = transport
        local_ts = dynamic[udp/1701]
        remote_ts = dynamic[udp]
        esp_proposals = aes256-sha256,aes256-sha1,aes128-sha1,aes256-sha1-modp1024,aes128-sha1-modp1024,aes256-sha256-modp2048,3des-sha1
      }
    }
  }
}
