; ISPGrid: L2TP for routers/NAS without WireGuard (RouterOS 6). The firewall accepts it only inside IPsec.
; pppd gives each router/NAS the fixed address of its line in /etc/ppp/chap-secrets (l2tp-add-peer.sh).
[global]
port = 1701

[lns default]
assign ip = no
require authentication = yes
name = ispgrid
pppoptfile = /etc/ppp/options.ispgrid-l2tp
length bit = yes
